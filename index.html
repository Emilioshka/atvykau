.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.top .who{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let me=null,tab='home',flt={d:'',e:''},cache=[],seq=0,EMP=[],WS='08:00',lang=lsGet('atv_lang','lt')=='en'?'en':'lt';
const st={busy:0,err:'',msg:'',lb:'',rej:''};
const t=(k,...a)=>String(I[lang][k]??I.lt[k]??k).replace(/\{(\d)\}/g,(_,i)=>a[i]);
const norm=s=>String(s).normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().trim().replace(/\s+/g,'.');
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fd=s=>{const d=new Date(s+'T12:00:00');return isNaN(d)?esc(s):new Intl.DateTimeFormat(lang=='lt'?'lt-LT':'en-GB',{day:'numeric',month:'long',year:'numeric'}).format(d)};
const hmOf=x=>x?new Date(x).toLocaleTimeString('lt-LT',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Vilnius'}):'';
const mins=s=>{const a=String(s||'').split(':');return a.length>=2?a[0]*60+ +a[1]:NaN};
const diff=x=>mins(x.time)-mins(x.ws||WS);
const dur=x=>{const m=mins(x.out)-mins(x.time);return m>0?t('hm',Math.floor(m/60),m%60):''};
const ph=p=>/^https:\/\/[^\s"'<>]+$/.test(p||'')?p:'';
const desc=(a,b)=>(b.date+b.time).localeCompare(a.date+a.time);
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};i.src=r.result};r.readAsDataURL(f)});
const up=async(f,tag)=>{const path=me.id+'/'+tag+today()+'-'+Date.now()+'.jpg',blob=await (await fetch(await shrink(f))).blob();const r=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});if(r.error)throw r.error;return path};

const mapRows=async rows=>{
 const paths=rows.flatMap(r=>[r.photo_path,r.left_photo_path]).filter(Boolean),u={};
 if(paths.length)((await sb.storage.from('photos').createSignedUrls(paths,3600)).data||[]).forEach(d=>{u[d.path]=d.signedUrl});
 return rows.map(r=>({id:r.id,empId:r.user_id,name:(r.profiles&&r.profiles.full_name)||me.name,date:r.day,time:hmOf(r.arrived_at),out:hmOf(r.left_at),ws:r.work_start?String(r.work_start).slice(0,5):'',photo:u[r.photo_path]||'',lphoto:u[r.left_photo_path]||'',ok:r.status=='confirmed',no:r.status=='rejected',c:r.comment||''}))};

 return hd+`<div class=card><b>${t('arrivedAt',esc(x.time))}</b>${isNaN(d)?'':`<div class=mu>${d>0?t('lateYou',d,x.ws||WS):t('onTimeYou')}</div>`}${x.out?`<div class=mu>${t('leftAt',esc(x.out))}${dur(x)?'. '+t('worked',dur(x)):''}</div>`:''}${x.no?`<div class=rc>${t('rejNote')}${x.c?': '+esc(x.c):''}</div>`:''}${pics(x,0)}</div>`+

 return `<div class=card><b>${t('wsT')}</b><div class=set><input type=time id=wsv value="${esc(WS)}" aria-label="${t('wsT')}"><button class=sm data-a=ws>${t('save')}</button></div></div>`+
 `<h2>${t('todayT')}</h2><p class=mu>${fd(today())}. ${t('summary',td.length,EMP.length,td.filter(x=>diff(x)>0).length)}</p>`+
 (td.length?td.map((x,i)=>`<div class=card><div class=row><div class=g><b>${esc(x.name)}</b>${inf(x)}</div><div class=sd>${timeB(x)}</div></div>${pics(x,i)}${conf(x)}</div>`).join(''):`<div class="card mu">${t('none')}</div>`)+
 `<h3>${t('notYet')}</h3>`+(miss.length?`<div class=chips>${miss.map(e=>`<span class=chip>${esc(e.name)}</span>`).join('')}</div>`:`<div class=card>${t('allIn')}</div>`);
};
const h0=async()=>{
 const r=(await B.mine()).sort(desc);cache=r;
 return `<h2>${t('myHist')}</h2>`+(r.length?r.map((x,i)=>`<div class=card><div class=row><div class=g><b>${fd(x.date)}</b>${inf(x)}</div><div class=sd>${timeB(x)}${stat(x)}</div></div>${pics(x,i)}${x.no&&x.c?`<div class=rc>${esc(x.c)}</div>`:''}</div>`).join(''):`<div class="card mu">${t('noHist')}</div>`);
};
const h1=async()=>{
 const r=(await B.all()).filter(x=>(!flt.d||x.date==flt.d)&&(!flt.e||x.empId==flt.e)).sort(desc);cache=r;
 return `<h2>${t('galT')}</h2><div class=flt><input type=date id=fd value="${esc(flt.d)}" aria-label="${t('dateL')}"><select id=fe aria-label="${t('empL')}"><option value="">${t('allEmp')}</option>${EMP.map(e=>`<option value=${e.id} ${flt.e==e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>`+
 (flt.d||flt.e?`<button class=lnk data-a=clr>${t('clear')}</button>`:'')+
 (r.length?`<div class=grid>${r.map((x,i)=>`<div class="card gc">${pics(x,i)}<b>${esc(x.name)}</b><div class=mu>${fd(x.date)}, ${esc(x.time)}${x.out?' – '+esc(x.out):''}</div>${timeB(x)}${dur(x)?`<div class=mu>${t('worked',dur(x))}</div>`:''}${conf(x)}</div>`).join('')}</div>`:`<div class="card mu">${t('noMatch')}</div>`);
};
V.home=()=>me.role=='employer'?e1():e0();
V.hist=()=>me.role=='employer'?h1():h0();
V.about=()=>`<h2>${t('aboutT')}</h2><div class=card>${t('aboutP')}</div><video class=vv controls playsinline preload=metadata poster="atvykau-poster.jpg" src="atvykau.mp4"></video><h3>${t('follow')}</h3><div class=soc><a href="https://www.facebook.com" target=_blank rel=noopener>Facebook</a><a href="https://www.instagram.com" target=_blank rel=noopener>Instagram</a><a href="https://www.linkedin.com" target=_blank rel=noopener>LinkedIn</a></div>`;
V.prof=()=>`<h2>${t('profT')}</h2><div class=card><b>${esc(me.name)}</b><div class=mu>${t('loginName')}: ${esc(me.user)}</div><p><span class=bdg>${t(me.role)}</span></p></div><div class="card mu">${t('privacy')}</div><button class=btn data-a=out>${t('logout')}</button>`;

async function render(){
 const n=++seq,m=$('#m'),nav=$('#n');
 document.documentElement.lang=lang=='lt'?'lt':'en-GB';
 if(!me){nav.innerHTML='';m.innerHTML=`<div class=top><span></span>${langB()}</div>`+V.login();$('#lb').innerHTML='';return}
 nav.innerHTML=[['home','🏠'],['hist','🕘'],['about','ℹ️'],['prof','👤']].map(([k,i])=>`<button data-a=tab data-t=${k} class="${tab==k?'on':''}"><span>${i}</span>${t(k)}</button>`).join('');
 let h;try{h=await V[tab]()}catch{h=`<div class=er>${t('loadFail')}</div>`}
 if(n!=seq)return;
 m.innerHTML=`<div class=top><span class=who>👤 ${esc(me.name)}, ${t('r_'+me.role)}</span>${langB()}</div>`+(st.msg?`<div class=ok>${esc(st.msg)}</div>`:'')+(st.err?`<div class=er>${esc(st.err)}</div>`:'')+h;
 $('#lb').innerHTML=st.lb?`<div class=lbx data-a=lbx><img src="${st.lb}" alt=""></div>`:'';
}
async function login(u,pw){
 if(/JUSU/.test(SUPABASE_URL)){st.err=t('noCfg');return render()}
 const {data,error}=await sb.auth.signInWithPassword({email:norm(u)+'@atvykau.lt',password:pw});
 if(error){st.err=t('badLogin');return render()}
 await start(data.user);
}
async function start(u){
 const {data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
 if(!p){await sb.auth.signOut();st.err=t('noProf');return render()}
 me={id:u.id,user:p.username,name:p.full_name,role:p.role};
 const s=await sb.from('settings').select('work_start').eq('id',1).maybeSingle();if(s.data&&s.data.work_start)WS=String(s.data.work_start).slice(0,5);
 if(me.role=='employer'){const {data:e}=await sb.from('profiles').select('id,full_name').eq('role','employee').order('full_name');EMP=(e||[]).map(x=>({id:x.id,name:x.full_name}))}
 tab='home';st.err=st.msg='';render();
}
const nowHM=()=>hmOf(new Date());
async function doIn(f){
 st.busy=1;st.err=st.msg='';render();
 try{
  if((await B.mine()).some(x=>x.date==today()))st.err=t('dup');
  else{const path=await up(f,'in-');await B.add(path);const d=diff({time:nowHM(),ws:WS});st.msg=t('okIn')+(d>0?' '+t('lateYou',d,WS):'')}
 }catch(e){st.err=t('saveFail')+' ('+((e&&(e.code||e.message))||'?')+')'}
 st.busy=0;render();
}
async function doOut(f){
 st.busy=1;st.err=st.msg='';render();
 try{const path=await up(f,'out-');await B.leave(path);st.msg=t('okOut')}
 catch(e){st.err=t('outFail')+' ('+((e&&(e.code||e.message))||'?')+')'}
 st.busy=0;render();
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a=='tab'){tab=b.dataset.t;st.msg=st.err='';render()}
 else if(a=='lang'){lang=b.dataset.l=='en'?'en':'lt';lsSet('atv_lang',lang);st.msg=st.err='';render()}
 else if(a=='img'){st.lb=ph((cache[+b.dataset.i]||{})[b.dataset.k]);render()}
 else if(a=='lbx'){st.lb='';render()}
 else if(a=='ok'){b.disabled=true;try{await B.decide(b.dataset.id,{ok:1});st.err=''}catch{st.err=t('cfmFail')}render()}
 else if(a=='rj'){st.err=st.msg='';st.rej=b.dataset.id;render()}
 else if(a=='rjno'){st.rej='';render()}
 else if(a=='rjgo'){const c=($('#rcm').value||'').trim();if(!c){st.err=t('needC');return render()}try{await B.decide(b.dataset.id,{no:1,c});st.rej='';st.err=''}catch{st.err=t('rejFail')}render()}
 else if(a=='ws'){const v=$('#wsv').value;if(!/^\d\d:\d\d$/.test(v))return;try{const r=await sb.rpc('set_work_start',{p_start:v});if(r.error)throw r.error;WS=v;st.err='';st.msg=t('wsOk')}catch{st.msg='';st.err=t('wsFail')}render()}
 else if(a=='out'){await sb.auth.signOut();me=null;EMP=[];tab='home';st.err=st.msg='';render()}
 else if(a=='clr'){flt={d:'',e:''};render()}
});
document.addEventListener('submit',e=>{if(e.target.id=='f'){e.preventDefault();login($('#em').value,$('#pw').value)}});
document.addEventListener('change',e=>{const i=e.target.id;if(i=='fd'){flt.d=e.target.value;render()}else if(i=='fe'){flt.e=e.target.value;render()}});
[['cam',doIn],['gal',doIn],['camo',doOut],['galo',doOut]].forEach(([id,fn])=>$('#'+id).addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f&&!st.busy)fn(f)}));
render();
(async()=>{try{const {data}=await sb.auth.getSession();if(data.session)await start(data.session.user)}catch{}})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
