async function login(u,pw){
 if(/JUSU/.test(SUPABASE_URL)){st.err=t('noCfg');return render()}
 const {data,error}=await sb.auth.signInWithPassword({email:norm(u)+'@atvykau.lt',password:pw});
 if(error){st.err=t('badLogin');return render()}
 await start(data.user);
}
async function start(u){
 const {data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
 if(!p){await sb.auth.signOut();st.err=t('noProf');return render()}
 me={id:u.id,user:p.username,name:p.full_name,role:p.role};
 await loadData();
 if(me.role=='employer'){const {data:e}=await sb.from('profiles').select('id,full_name').eq('role','employee').order('full_name');EMP=(e||[]).map(x=>({id:x.id,name:x.full_name}))}
 tab='home';st.err=st.msg='';render();
 if(me.role=='employee')gpsInit().then(()=>{if(GPS!='granted')askGps()});
}
async function doIn(f){
 st.busy=1;st.err=st.msg='';render();
 try{
  if((await B.mine()).some(x=>x.date==today()))st.err=t('dup');
  else{const pos=await getPos(),path=await up(f,'in-');await B.add(path,pos);const x=(await B.mine()).find(r=>r.date==today()),d=x&&x.dm;st.msg=t('okIn')+(d>0?' '+t('lateYou',fm(d),x.ss):'')+(pos?'':t('noGpsNote'))}
 }catch(e){st.err=em(e,'saveFail')}
 st.busy=0;render();
}
async function doOut(f){
 st.busy=1;st.err=st.msg='';render();
 try{const pos=await getPos(),path=await up(f,'out-');await B.leave(path,pos);st.msg=t('okOut')}
 catch(e){st.err=em(e,'outFail')}
 st.busy=0;render();
}
async function doRetake(f){
 st.busy=1;st.err=st.msg='';render();
 try{const path=await up(f,'re-');await B.retake(path);st.msg=t('retakeDone')}
 catch(e){st.err=em(e,'retakeFail')}
 st.busy=0;render();
}

 else if(a=='siteNew'){SE={id:'',name:'',lat:54.6872,lng:25.2797,z:13,r:150};st.sub='site';st.err=st.msg='';render();getPos().then(p=>{if(p&&MAP&&SE&&!SE.id&&!SE.moved)MAP.setView([p.lat,p.lng],17)})}
 else if(a=='siteEdit'){const s=SITES.find(x=>x.id==b.dataset.id);if(s){SE={id:s.id,name:s.name,lat:+s.lat,lng:+s.lng,z:17,r:+s.radius_m};st.sub='site';st.err=st.msg='';render()}}
 else if(a=='useLoc'){const p=await getPos();if(p&&MAP)MAP.setView([p.lat,p.lng],18);else{SE.name=$('#sn').value;st.err=t('locFail');render()}}
 else if(a=='geo'){const q=$('#gq').value.trim();if(!q)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language='+lang+'&q='+encodeURIComponent(q)),j=await r.json();if(j[0]&&MAP){MAP.setView([+j[0].lat,+j[0].lon],17);st.err=''}else throw 0}catch{SE.name=$('#sn').value;st.err=t('notFound');render()}}
 else if(a=='siteSave'){SE.name=$('#sn').value.trim();if(!SE.name||!isFinite(SE.lat)||!isFinite(SE.lng)){st.err=t('badSite');return render()}
  const row={name:SE.name,lat:+SE.lat.toFixed(6),lng:+SE.lng.toFixed(6),radius_m:Math.max(20,Math.min(5000,Math.round(SE.r)||150))};
  try{const x=await (SE.id?sb.from('sites').update(row).eq('id',SE.id):sb.from('sites').insert(row));if(x.error)throw x.error;await loadData();SE=null;st.sub='';st.err='';st.msg=t('siteSaved')}catch{st.err=t('saveFail')}render()}

 else if(a=='cm'){CAL.m+=+b.dataset.d;if(CAL.m<0){CAL.m=11;CAL.y--}else if(CAL.m>11){CAL.m=0;CAL.y++}CAL.sel=[];render()}
