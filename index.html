 else if(a=='rjno'){st.rej='';render()}
 else if(a=='rjgo'){const c=($('#rcm').value||'').trim();if(!c){st.err=t('needC');return render()}try{await B.decide(b.dataset.id,{no:1,c});st.rej='';st.err=''}catch{st.err=t('rejFail')}render()}
 else if(a=='ws'){const v=$('#wsv').value;if(!/^\d\d:\d\d$/.test(v))return;try{const r=await sb.rpc('set_work_start',{p_start:v});if(r.error)throw r.error;WS=v;st.err='';st.msg=t('wsOk')}catch{st.msg='';st.err=t('wsFail')}render()}
 else if(a=='gear'){tab='set';st.sub='';ED=null;SE=null;st.msg=st.err='';render()}
 else if(a=='back'){st.sub='';ED=null;SE=null;st.err='';render()}
 else if(a=='theme'){theme=b.dataset.v;lsSet('atv_theme',theme);applyTheme();render()}
 else if(a=='strict'){try{const r=await sb.rpc('set_strict_gps',{p:!STRICT});if(r.error)throw r.error;STRICT=!STRICT;st.err=''}catch{st.err=t('saveFail')}render()}
 else if(a=='rt'){b.disabled=true;try{await B.askRetake(b.dataset.id);st.err=''}catch{st.err=t('rtFail')}render()}
 else if(a=='csv')csv();
 else if(a=='siteNew'){SE={id:'',name:'',coords:'',r:150};st.sub='site';st.err=st.msg='';render()}
 else if(a=='siteEdit'){const s=SITES.find(x=>x.id==b.dataset.id);if(s){SE={id:s.id,name:s.name,coords:s.lat+', '+s.lng,r:s.radius_m};st.sub='site';st.err=st.msg='';render()}}
 else if(a=='useLoc'){SE.name=$('#sn').value;SE.r=$('#sr').value;const p=await getPos();if(!p){st.err=t('locFail');return render()}SE.coords=p.lat.toFixed(6)+', '+p.lng.toFixed(6);st.err='';render()}
 else if(a=='siteSave'){SE.name=$('#sn').value.trim();SE.coords=$('#sc').value;SE.r=Math.max(20,Math.min(5000,+$('#sr').value||150));
  const m=SE.coords.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(!SE.name||!m||Math.abs(+m[1])>90||Math.abs(+m[2])>180){st.err=t('badCoords');return render()}
  const row={name:SE.name,lat:+m[1],lng:+m[2],radius_m:SE.r};
  try{const x=await (SE.id?sb.from('sites').update(row).eq('id',SE.id):sb.from('sites').insert(row));if(x.error)throw x.error;await loadData();SE=null;st.sub='';st.err='';st.msg=t('siteSaved')}catch{st.err=t('saveFail')}render()}
 else if(a=='siteDel'){try{const x=await sb.from('sites').delete().eq('id',SE.id);if(x.error)throw x.error;await loadData();SE=null;st.sub='';st.err=''}catch{st.err=t('saveFail')}render()}
 else if(a=='emp'){const u=b.dataset.id;ED={uid:u,q:WS,days:[1,2,3,4,5,6,7].map(w=>{const p=planW(u,w);return{m:p.m,s:p.s}}),sites:[...(ES[u]||[])]};st.sub='emp';st.err=st.msg='';render()}
 else if(a=='qwk'){ED.days=ED.days.map((d,i)=>i<5?{m:'time',s:ED.q||WS}:{m:'off',s:''});render()}
 else if(a=='qany'){ED.days=ED.days.map(()=>({m:'any',s:''}));render()}
 else if(a=='schedSave'){try{
  const rows=ED.days.map((d,i)=>({user_id:ED.uid,weekday:i+1,mode:d.m,start_time:d.m=='time'?(d.s||WS):null}));
  let r=await sb.from('schedules').upsert(rows,{onConflict:'user_id,weekday'});if(r.error)throw r.error;
  r=await sb.from('employee_sites').delete().eq('user_id',ED.uid);if(r.error)throw r.error;
  if(ED.sites.length){r=await sb.from('employee_sites').insert(ED.sites.map(s=>({user_id:ED.uid,site_id:s})));if(r.error)throw r.error}
  await loadData();ED=null;st.sub='';st.err='';st.msg=t('schedSaved')}catch{st.err=t('saveFail')}render()}
 else if(a=='out'){await sb.auth.signOut();me=null;EMP=[];tab='home';st.err=st.msg='';render()}
 else if(a=='clr'){flt={d:'',e:''};render()}
});
document.addEventListener('submit',e=>{if(e.target.id=='f'){e.preventDefault();login($('#em').value,$('#pw').value)}});
document.addEventListener('change',e=>{const x=e.target,i=x.id,a=x.dataset.a,n=+x.dataset.i;
 if(i=='fd'){flt.d=x.value;render()}else if(i=='fe'){flt.e=x.value;render()}
 else if(a=='dm'){ED.days[n].m=x.value;if(x.value=='time'&&!ED.days[n].s)ED.days[n].s=WS;render()}
 else if(a=='dt'){ED.days[n].s=x.value}
 else if(a=='ds'){const id=x.dataset.id;ED.sites=x.checked?[...new Set([...ED.sites,id])]:ED.sites.filter(s=>s!=id)}
 else if(i=='qt'){ED.q=x.value}
});
[['cam',doIn],['gal',doIn],['camo',doOut],['galo',doOut],['camr',doRetake],['galr',doRetake]].forEach(([id,fn])=>$('#'+id).addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f&&!st.busy)fn(f)}));
applyTheme();render();
(async()=>{try{const {data}=await sb.auth.getSession();if(data.session)await start(data.session.user)}catch{}})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
